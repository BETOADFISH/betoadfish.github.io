<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生物题库 · 管理</title><style>
:root{font-family:system-ui,'Microsoft Yahei',sans-serif;background:#f4f6f3;color:#203c32;--accent:#23645d}body{max-width:1200px;margin:auto;padding:25px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:24px}button,input,select,textarea{font:inherit;border:1px solid #d8e0db;border-radius:6px;padding:10px;background:white;color:inherit}button{cursor:pointer}button:disabled{opacity:.5}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.primary{background:var(--accent);color:white}.toolbar{display:flex;gap:10px;margin:20px 0}.layout{display:grid;grid-template-columns:340px 1fr;gap:22px}#list{display:grid;gap:8px;align-content:start;max-height:80vh;overflow:auto}#list button{text-align:left;font-size:13px;line-height:1.6}section{background:white;border:1px solid #dce3df;border-radius:12px;padding:22px}label{display:block;margin:16px 0 5px;font-size:13px}input,textarea{box-sizing:border-box;width:100%}textarea{min-height:65px;resize:vertical}.json{min-height:120px;font-family:monospace;font-size:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}#status{min-height:25px;font-size:14px}small{color:#607369}a{color:var(--accent)}.hidden{display:none}@media(max-width:750px){.layout{grid-template-columns:1fr}#list{max-height:30vh}.toolbar{flex-wrap:wrap}body{padding:15px}}
</style></head><body><header><h1>题库管理</h1><div style="display:flex;align-items:center;gap:18px"><a href="https://github.com/BETOADFISH/betoadfish.github.io/actions/workflows/pages.yml" target="_blank" rel="noreferrer">网站同步记录</a><a href="/admin/api/backup">备份修改记录</a><!--SIGNOUT--></div></header><div class="toolbar"><select id="bank" aria-label="题库"><option value="edexcel">Edexcel</option><option value="aqa">AQA AS</option><option value="esat">ESAT Biology</option></select><input id="search" aria-label="搜索题目" placeholder="题号或关键词"><button id="find">搜索</button><button id="previous">上一页</button><button id="next">下一页</button></div><p id="status" role="status"></p><div class="layout"><nav id="list" aria-label="题目列表"></nav><section><p id="empty">选一道题开始编辑。</p><form id="editor" class="hidden"><h2 id="title"></h2><small id="state"></small><label for="summary">题目简述</label><input id="summary" maxlength="180" required><label for="marks">分值</label><input id="marks" type="number" min="0" max="100" required><label for="topics">考点（每行一个）</label><textarea id="topics"></textarea><label for="chapters">章节（每行一个）</label><textarea id="chapters"></textarea><label for="skills">技能（每行一个）</label><textarea id="skills"></textarea><details><summary>调整原题与答案范围</summary><p><small>坐标为页面比例 [左, 上, 右, 下]，范围0–1。保留完整题干、选项和图表。</small></p><label for="qp">题目范围</label><textarea id="qp" class="json"></textarea><label for="ms">答案范围</label><textarea id="ms" class="json"></textarea></details><div class="actions"><button type="submit" class="primary">保存草稿</button><button type="button" id="publish">发布草稿</button><button type="button" id="unpublish">下架</button></div><p><small>草稿仅自己可见。发布或下架后，公开网站会在下一次同步完成后更新，通常需15–30分钟。</small></p></form></section></div><script>
const $=id=>document.getElementById(id);let page=0,current=null,busy=false;const colors={edexcel:'#23645d',aqa:'#625387',esat:'#9a6330'};
function notice(s){$('status').textContent=s;}async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:undefined,body:body?JSON.stringify(body):undefined});if(!r.ok){let data={};try{data=await r.json()}catch{}throw Error(data.error||'请求失败，请刷新后重试。')}return r.json()}
async function run(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn()}catch(e){notice(e.message)}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);$('publish').disabled=!current?.draft;}}
async function list(){const bank=$('bank').value;document.documentElement.style.setProperty('--accent',colors[bank]);const rows=await api('/admin/api/list?bank='+bank+'&page='+page+'&q='+encodeURIComponent($('search').value));$('list').replaceChildren();for(const row of rows){const b=document.createElement('button');b.textContent=row.title+' · '+row.label+' — '+row.summary+' ['+({draft:'有草稿',unpublished:'已下架',published:'已发布'}[row.status])+']';b.onclick=()=>run(()=>open(row.id));$('list').append(b)}notice(rows.length?'第 '+(page+1)+' 页':'没有找到题目。')}
async function open(id){current=await api('/admin/api/'+$('bank').value+'/'+encodeURIComponent(id));const q={...current.base,...(current.changed?current.published||{}:{}),...current.draft};$('empty').classList.add('hidden');$('editor').classList.remove('hidden');$('title').textContent=q.paper_title+' · '+q.label;$('state').textContent=current.draft?'当前编辑的是草稿':current.changed&&!current.published?'已下架':'已发布';$('summary').value=q.summary;$('marks').value=q.marks;$('marks').readOnly=!q.is_leaf;for(const key of ['topics','chapters','skills'])$(key).value=(q[key]||[]).join('\n');for(const key of ['qp','ms'])$(key).value=JSON.stringify(q[key],null,2);$('publish').disabled=!current.draft;}
$('find').onclick=()=>run(async()=>{page=0;await list()});$('previous').onclick=()=>run(async()=>{page=Math.max(0,page-1);await list()});$('next').onclick=()=>run(async()=>{page++;await list()});$('bank').onchange=()=>run(async()=>{page=0;current=null;$('editor').classList.add('hidden');$('empty').classList.remove('hidden');await list()});$('search').onkeydown=e=>{if(e.key==='Enter')$('find').click()};
$('editor').onsubmit=e=>{e.preventDefault();run(async()=>{const patch={summary:$('summary').value,marks:Number($('marks').value)};for(const key of ['topics','chapters','skills'])patch[key]=$(key).value.split('\n').map(x=>x.trim()).filter(Boolean);for(const key of ['qp','ms'])patch[key]=JSON.parse($(key).value);await api('/admin/api/'+$('bank').value+'/'+encodeURIComponent(current.id),{action:'save',revision:current.revision,patch});await open(current.id);notice('草稿已保存。')})};
for(const action of ['publish','unpublish'])$(action).onclick=()=>run(async()=>{if(!current)return;if(!confirm(action==='publish'?'发布这份草稿？':'将这道题从公开题库下架？'))return;await api('/admin/api/'+$('bank').value+'/'+encodeURIComponent(current.id),{action,revision:current.revision});await open(current.id);notice(action==='publish'?'已提交发布，等待网站同步。':'已提交下架，等待网站同步。')});run(list);
</script></body></html>
