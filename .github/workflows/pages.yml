name: Publish portfolio
on:
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sync published questions
        id: snapshot
        run: node scripts/sync-public-questions.mjs
      - run: node node_modules/typescript/bin/tsc --noEmit
        if: steps.snapshot.outputs.changed == 'true'
      - run: node scripts/test-question-bank.mjs
        if: steps.snapshot.outputs.changed == 'true'
      - run: node scripts/test-random-paper.mjs
        if: steps.snapshot.outputs.changed == 'true'
      - run: node scripts/test-admin.mjs
        if: steps.snapshot.outputs.changed == 'true'
      - run: node scripts/test-github-auth.mjs
        if: steps.snapshot.outputs.changed == 'true'
      - run: pnpm build
        if: steps.snapshot.outputs.changed == 'true'
      - run: touch dist/client/.nojekyll
        if: steps.snapshot.outputs.changed == 'true'
      - uses: actions/configure-pages@v5
        if: steps.snapshot.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.snapshot.outputs.changed == 'true'
        with:
          path: dist/client
      - name: Deploy
        if: steps.snapshot.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
